version = project.expansion_version

group = 'com.nstut.ftbice'
base.archivesName = "${project.expansion_archive_name}-neoforge-${rootProject.minecraft_version_26_1_2}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

apply from: rootProject.file('gradle/curseforge-repositories.gradle')

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'vazkii.patchouli'
        }
    }
}

neoForge {
    version = rootProject.neoforge_version_26_1_2

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.expansion_mod_id
        }
    }

    mods {
        "${project.expansion_mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.getByName(project.expansion_mod_id)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def ftbicCoordinate = "curse.maven:ftb-industrial-contraptions-forge-${rootProject.ftbic_curse_project}:${rootProject.ftbic_curse_file_26_1_2}"
def nstutLibCoordinate = "com.nstut.nstutlib:nstutlib-neoforge-26.1.2:${rootProject.nstut_lib_version}"
def jeiApiCoordinate = "mezz.jei:jei-26.1.2-neoforge-api:${rootProject.jei_version_26_1_2}"
def jeiRuntimeCoordinate = "mezz.jei:jei-26.1.2-neoforge:${rootProject.jei_version_26_1_2}"
def jadeCoordinate = "curse.maven:jade-324717:${rootProject.jade_curse_file_26_1_2}"
def guideMeApiCoordinate = "org.appliedenergistics:guideme:${rootProject.guideme_version_26_1_2}:api"
def guideMeRuntimeCoordinate = "org.appliedenergistics:guideme:${rootProject.guideme_version_26_1_2}"
def patchouliApiCoordinate = "vazkii.patchouli:patchouli-neoforge:${rootProject.patchouli_version_26_1_2}:api"
def patchouliRuntimeCoordinate = "vazkii.patchouli:patchouli-neoforge:${rootProject.patchouli_version_26_1_2}"

dependencies {
    compileOnly ftbicCoordinate
    localRuntime ftbicCoordinate

    if (project.expansion_mod_id == 'ftbicec') {
        implementation nstutLibCoordinate
    }

    compileOnly jeiApiCoordinate
    localRuntime jeiRuntimeCoordinate
    compileOnly jadeCoordinate
    localRuntime jadeCoordinate
    compileOnly guideMeApiCoordinate
    localRuntime guideMeRuntimeCoordinate
    compileOnly patchouliApiCoordinate
    localRuntime patchouliRuntimeCoordinate

    testImplementation enforcedPlatform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.neoforged:testframework:${rootProject.neoforge_version_26_1_2}"
    testRuntimeOnly ftbicCoordinate
    testRuntimeOnly jeiRuntimeCoordinate
    testRuntimeOnly jadeCoordinate
    testRuntimeOnly guideMeRuntimeCoordinate
    testRuntimeOnly patchouliRuntimeCoordinate
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        mod_id: project.expansion_mod_id,
        mod_name: project.expansion_mod_name,
        mod_version: project.expansion_version,
        mod_description: project.expansion_description,
        minecraft_version_range: rootProject.minecraft_version_range_26_1_2,
        neo_version: rootProject.neoforge_version_26_1_2,
        ftbic_version: rootProject.ftbic_version_26_1_2,
        nstut_lib_version: rootProject.nstut_lib_version,
        core_version: rootProject.core_version,
        guideme_version: rootProject.guideme_version_26_1_2
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
