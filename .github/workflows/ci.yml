name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test shared code
        run: ./gradlew --no-daemon :common:check --stacktrace

  forge-1-19-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Forge 1.19.2
        run: |
          chmod +x legacy-1.19.2/gradlew
          ./legacy-1.19.2/gradlew --no-daemon -p legacy-1.19.2 build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-jars
          if-no-files-found: error
          path: |
            FTB-IC-Expansion-Core/build/libs/*.jar
            FTB-IC-Expansion-Generators/build/libs/*.jar

  neoforge-26-1-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Resolve validated NsTut Lib revision
        id: nstut-ref
        shell: bash
        run: |
          ref="$(sed -n 's/^nstut_lib_ref=//p' gradle.properties)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid nstut_lib_ref in gradle.properties: $ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: UpperMoon0/NsTut-Lib
          ref: ${{ steps.nstut-ref.outputs.ref }}
          path: .ci/nstut-lib
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish NsTut Lib 26.1.2 to Maven Local
        working-directory: .ci/nstut-lib
        run: ./gradlew :neoforge-26.1.2:publishToMavenLocal --no-daemon --stacktrace
      - name: Build and runtime-smoke NeoForge 26.1.2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon verifyModern2612 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-26.1.2-jars
          if-no-files-found: error
          path: |
            neoforge-26.1.2-core/build/libs/*.jar
            neoforge-26.1.2-generators/build/libs/*.jar
