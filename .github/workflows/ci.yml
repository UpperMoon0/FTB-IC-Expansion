name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test shared code
        run: ./gradlew --no-daemon :common:check --stacktrace

  forge-1-19-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Forge 1.19.2
        run: |
          chmod +x legacy-1.19.2/gradlew
          ./legacy-1.19.2/gradlew --no-daemon -p legacy-1.19.2 build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-jars
          if-no-files-found: error
          path: |
            FTB-IC-Expansion-Core/build/libs/*.jar
            FTB-IC-Expansion-Generators/build/libs/*.jar

  neoforge-26-1-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and runtime-smoke NeoForge 26.1.2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon buildModern2612 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-26.1.2-jars
          if-no-files-found: error
          path: |
            neoforge-26.1.2-core/build/libs/*.jar
            neoforge-26.1.2-generators/build/libs/*.jar
