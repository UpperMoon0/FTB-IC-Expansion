plugins {
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.77'
}

def workspaceProperties = new Properties()
def workspacePropertiesFile = file('../gradle.properties')
if (workspacePropertiesFile.exists()) {
    workspacePropertiesFile.withInputStream { workspaceProperties.load(it) }
}
def workspaceProperty = { String name, String fallback -> workspaceProperties.getProperty(name, fallback) }

version = workspaceProperty('core_version', '1.0.11')
group = 'com.jjyp.ftbicec'
archivesBaseName = 'IC-Expansion-Core'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: workspaceProperty('minecraft_version_1_19_2', '1.19.2')
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'ftbicec'
            mods { ftbicec { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'ftbicec'
            mods { ftbicec { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'ftbicec'
            mods { ftbicec { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'ftbicec', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { ftbicec { source sourceSets.main } }
        }
    }
}

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir 'src/generated/resources'

apply from: file('../gradle/curseforge-repositories.gradle')

repositories {
    maven {
        url 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        url 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        url 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${workspaceProperty('minecraft_version_1_19_2', '1.19.2')}-${workspaceProperty('forge_version_1_19_2', '43.2.8')}"
    implementation(fg.deobf('dev.ftb.mods:ftb-library-forge:1902.3.18-build.208', { transitive = false }))
    implementation(fg.deobf('dev.architectury:architectury-forge:6.5.77', { transitive = false }))
    implementation(fg.deobf('dev.ftb.mods:ftb-industrial-contraptions:1900.1.7-build.221', { transitive = false }))
    implementation(fg.deobf('mezz.jei:jei-1.19.2-forge:11.6.0.1015', { transitive = false }))
    implementation fg.deobf('curse.maven:myrtrees-546151:4371268')
    implementation fg.deobf('curse.maven:patchouli-306770:4031402')
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: project.version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'ftbicec',
            'Specification-Vendor': 'NsTut',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'NsTut',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
jar.finalizedBy('reobfJar')

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url "file://${project.projectDir}/mcmodsrepo" } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
