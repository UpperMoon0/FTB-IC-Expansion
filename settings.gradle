pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'ftb-ic-expansion'

include 'common'
include 'neoforge-26.1.2-core'
include 'neoforge-26.1.2-generators'
